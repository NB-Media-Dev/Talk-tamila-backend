# docker-compose.yml
# ────────────────────
# Defines the services (containers) needed for local development.
#
# HOW TO USE:
#   Start:   docker-compose up -d
#   Stop:    docker-compose down
#   Wipe DB: docker-compose down -v   ← WARNING: deletes all data
#   Logs:    docker-compose logs -f db
#
# WHAT THIS RUNS:
#   - MySQL 8.0 (the database)
#
# The FastAPI app itself runs directly on your machine with uvicorn
# (not inside Docker) — that keeps hot-reload development fast and simple.

version: "3.9"

services:

  # ── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: talktamila_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: talktamila
      MYSQL_USER: talktamila_user
      MYSQL_PASSWORD: talktamila_pass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

